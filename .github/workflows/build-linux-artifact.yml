name: Build Linux deployment artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-artifact:
    name: Debian 12 / Node 22
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Keep production dependencies
        run: npm prune --omit=dev

      - name: Verify native runtime dependencies
        run: |
          node --input-type=module -e "const pty = await import('node-pty'); if (typeof pty.spawn !== 'function') process.exit(1)"
          node --input-type=module -e "const { default: Database } = await import('better-sqlite3'); const db = new Database(':memory:'); db.close()"

      - name: Package deployment bundle
        run: tar -czf devspace-linux-x64.tar.gz dist node_modules package.json package-lock.json README.md docs skills

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: devspace-linux-x64
          path: devspace-linux-x64.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
